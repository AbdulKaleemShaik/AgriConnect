# ---------------------------------------------------------------------------
# AgriConnect backend configuration.
# Every value that differs between environments is read from an environment
# variable; the defaults below are only meant for local development.
# Secrets (DB password, JWT secret, mail password) have NO committed defaults.
# ---------------------------------------------------------------------------
spring.application.name=agriconnect
server.port=${SERVER_PORT:8080}

# --- Database (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agriconnect?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:agriconnect}
spring.datasource.password=${DB_PASSWORD:}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Security / JWT ---
# Must be at least 32 bytes. If empty, a random key is generated at startup
# (fine for local dev; tokens then become invalid after every restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}
app.security.max-failed-logins=5
app.security.lock-duration=PT15M
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional bootstrap admin account (created on startup if both are set)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- File uploads (product and profile images) ---
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Mail (order notifications, password-reset OTP) ---
# Disabled by default: emails are logged instead of sent.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@agriconnect.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# --- Pagination ---
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
