spring.datasource.url=jdbc:h2:mem:agriconnect-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Flyway migrations are verified against real MySQL in CI (see .github/workflows/ci.yml).
spring.flyway.enabled=false

# Test-only signing key (not used anywhere else)
app.jwt.secret=test-only-jwt-secret-key-at-least-32-bytes-long
app.mail.enabled=false
app.storage.upload-dir=target/test-uploads
app.admin.email=admin@test.local
app.admin.password=Admin@12345
