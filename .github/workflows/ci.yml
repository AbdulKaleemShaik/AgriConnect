name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  migrations:
    name: Flyway migrations on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agriconnect
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost --silent"
          --health-interval 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Runs the whole suite against real MySQL: Flyway applies db/migration and
      # Hibernate validates that the schema matches every entity.
      - run: >-
          ./mvnw -B test
          -Dspring.datasource.url="jdbc:mysql://localhost:3306/agriconnect?serverTimezone=UTC"
          -Dspring.datasource.username=root -Dspring.datasource.password=root
          -Dspring.flyway.enabled=true -Dspring.jpa.hibernate.ddl-auto=validate

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agriconnect-backend ./backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
